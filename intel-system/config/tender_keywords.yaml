    中力: []

  # 集成商 / 系统集成 / 立体库
  tier2:
    迦智科技: []
    优艾智合: []
    国自机器人: [国自]
    寻迹智行: []
    艾吉威: []
    诺力股份: []
    音飞储存: []
    东杰智能: []
    新松机器人: [新松]
    CSG华晓: []
    昆船智能: []
    兰剑智能: []
    井松智能: []
    华章智能: []
    智库智能: []
    牧星智能: []
    隆博科技: []
