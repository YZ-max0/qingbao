# ── 检索地区：按需增删，先跑几个重点省份 ──────────────────────
regions:
  national:
    - name: 中国政府采购网
      url: http://search.ccgp.gov.cn/bxsearch
      type: ccgp
  provinces:                  # 待接入：各省公共资源交易中心
    - { code: guangdong, name: 广东 }
    - { code: jiangsu,   name: 江苏 }
    - { code: zhejiang,  name: 浙江 }
    - { code: shandong,  name: 山东 }
    - { code: anhui,     name: 安徽 }

# ── 抓取约束（合规）─────────────────────────────────────────
crawl_policy:
  delay_seconds: [2, 5]       # 每次请求随机延迟，避免压力
  max_pages_per_run: 40       # 单次运行页数上限
  respect_robots: true
  user_agent: "CompetitiveIntelBot/1.0 (+internal research; contact: set-your-email)"
