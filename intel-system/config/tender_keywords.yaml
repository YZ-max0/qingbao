# 招标/中标检索关键词 —— 仓储 AMR 专用
# 用途：在政府采购网、公共资源交易中心检索对手中标信息
# 说明：招标公告标题匹配用「品类词」，对手中标识别用「竞品名」

# ── 品类关键词：定义"这是不是我该看的标" ──────────────────────
category_keywords:
  core:                       # 强匹配：命中即可判定为同赛道
    - 仓储机器人
    - 移动机器人
    - AMR
    - AGV
    - 无人叉车
    - 智能仓储
    - 自动化立体库
    - 立体仓库
    - 货到人
    - 料箱机器人
    - 智能搬运
    - 仓储物流自动化
    - WMS
    - WCS
    - 机器人调度系统

  weak:                       # 弱匹配：需与场景词共现
    - 拣选
    - 搬运
    - 分拣
    - 输送线
    - 智能工厂
    - 数字化车间
    - 产线物流

  noise:                      # 排除词：命中则丢弃，降低误报
    - 扫地机器人
    - 教育机器人
    - 玩具
    - 家用
    - 医用机器人
    - 手术机器人

# ── 场景词：与弱匹配关键词共现时提升相关度 ────────────────────
scene_keywords:
  - 仓库
  - 物流中心
  - 配送中心
  - 生产车间
  - 工厂
  - 医药
  - 新能源
  - 锂电
  - 光伏
  - 汽车
  - 汽配
  - 3C
  - 电商
  - 第三方物流
  - 冷链

# ── 竞品名：用于识别"谁中标了"、媒体提及 ─────────────────────
# ── 竞品名：用于识别"谁中标了"、媒体提及 ─────────────────────
#
# 结构说明：
#   每个竞品写成「正式名: [别名...]」的映射，**正式名本身自动参与匹配**。
#   不要在同一列表里既写全称又写简称 —— 那样会被当成两个独立主体，
#   导致重复分析、重复消耗 Tavily 配额（实测踩过这个坑）。
#
# 匹配采用简单子串包含，故短名要足够独特（如"快仓"）；纯 2 字词
# 必须在此表中出现过才会参与匹配，避免误命中无关文本。
competitor_names:
  # 仓储 AMR / 货到人 / 料箱机器人
  tier1:
    海柔创新: []
    快仓智能: [快仓]
    极智数通: [极智嘉, 极智]
    立镖机器人: [立镖]
    海康机器人: []
