# LLM 凭据（模板）——复制为 llm.local.yaml 后填写
#
# 优先级：环境变量 OPENAI_API_KEY > 本文件
# 想停用 LLM：把 enabled 改为 false，或直接删除 llm.local.yaml
#
# 安全提醒：llm.local.yaml 以明文保存密钥，已被 .gitignore 排除。
# 切勿提交到版本库；怀疑泄露时立即到服务商后台轮换。

enabled: true

# 任何兼容 OpenAI 协议的服务都可以。
# 常见配置：
#   DeepSeek  base_url: https://api.deepseek.com/v1        model: deepseek-chat
#   OpenAI    base_url: https://api.openai.com/v1          model: gpt-4o-mini
#   Moonshot  base_url: https://api.moonshot.cn/v1         model: moonshot-v1-8k
#   通义千问   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#                                                          model: qwen-plus
#   智谱      base_url: https://open.bigmodel.cn/api/paas/v4
#                                                          model: glm-4-flash
provider: deepseek
base_url: https://api.deepseek.com/v1
model: deepseek-chat
api_key: ""

# 调用参数
batch_size: 5          # 每批处理条数（越大越省调用次数，但单次耗时更长）
max_body_chars: 3000   # 送入模型的正文字数上限，控制 token 成本
timeout: 180           # 单次请求超时（秒）
