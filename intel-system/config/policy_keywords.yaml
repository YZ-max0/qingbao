# 政策关键词 —— 独立于招标关键词
# 原因：政策标题几乎不会出现"AMR/AGV/仓储机器人"这类招标品类词，
# 若复用招标关键词打分，所有政策都会被过滤掉（实测：21 条全被丢）。
# 政策的关注点是"产业方向"，所以词表按政策语汇设计。

# ── 强匹配：命中即判定与智能制造/物流机器人相关 ──────────────
core:
  - 机器人
  - 智能制造
  - 智能工厂
  - 工业互联网
  - 制造业
  - 物流
  - 供应链
  - 人工智能
  - 数字化转型
  - 智能装备
  - 高端装备
  - 新质生产力
  - 自动化
  - 仓储
  - 智能物流
  - 工业软件
  - 两化融合
  - 专精特新

# ── 弱匹配：需与场景词共现才算相关 ──────────────────────────
weak:
  - 产业
  - 发展
  - 规划
  - 意见
  - 通知
  - 方案
  - 试点
  - 示范

# ── 噪音词：与赛道无关的政策方向，命中即丢弃 ────────────────
noise:
  - 体育赛事
  - 残疾预防
  - 文化遗产
  - 医疗康复
  - 旅游
  - 教育
  - 农业
  - 水利
  - 生态环保
  - 退役军人
  - 中医药

# ── 加分场景词：出现则说明与本公司业务场景相关 ──────────────
scene:
  - 新能源
  - 锂电
  - 光伏
  - 汽车
  - 医药
  - 电商
  - 3C
  - 冷链

# ── 打分参数 ────────────────────────────────────────────────
# 政策阈值宜低：行业政策大多不直接点名"机器人"，
# 宁可用"制造业/物流"这类宽口径收进来再人工筛。
threshold: 0.2
